name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build APK with JavaScript bundled
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Confirm JS bundle is included
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|assets/index.android.bundle.hbc'
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test opening on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell monkey -p com.mmsistemastecnologia.trucodomateus 1
            sleep 30
            adb shell pidof com.mmsistemastecnologia.trucodomateus
            adb shell dumpsys activity activities | grep com.mmsistemastecnologia.trucodomateus
            adb logcat -d -s AndroidRuntime:E ReactNativeJS:E > startup-errors.txt
            if grep -E 'FATAL EXCEPTION|Unable to load script' startup-errors.txt; then exit 1; fi
            adb shell screencap -p /sdcard/truco.png
            adb pull /sdcard/truco.png truco-startup.png
      - name: Upload test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truco-startup-test
          path: |
            truco-startup.png
            startup-errors.txt
          if-no-files-found: ignore
      - name: Publish test APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-teste
          name: Truco do Mateus - teste de abertura
          prerelease: true
          files: android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
